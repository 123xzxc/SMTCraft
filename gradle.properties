org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# --- game / loader (verified against piston-meta + maven.fabricmc.net) ------
# 26.x is deobfuscated and has no Yarn or Intermediary build, so mod code is
# written against the official class names that are already in the game jar.
# 26.1 is the oldest supported version and therefore the compile target: one jar
# then covers 26.1 through 26.4, with the signature changes resolved at runtime
# (util/Keys, gui/Widgets, gui/ScreenHooks, render/CoverTexture).
minecraft_version=26.1
loader_version=0.20.1
# Lowest Fabric API the mod accepts, on the 26.1 line (fabric.mod.json says the
# same). Nothing in this repository resolves this property - there is no Loom
# entry, only plain javac - so it is here for anyone syncing dependencies by
# hand: the toolchain used by build.sh carries a newer build of the same
# modules, which is fine because every module the mod uses is unchanged.
fabric_version=0.155.3+26.1

# --- mod ------------------------------------------------------------------
mod_version=1.0.1
maven_group=org.yinyun
archives_base_name=smtcraft
