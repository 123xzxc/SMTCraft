org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# --- 游戏与加载器 -----------------------------------------------------------
# 编译目标：Minecraft 1.8–1.8.9 这一条线，用 1.8.9 的最后一个 Forge 构建（11.15.1.2318）。
# 1.8 与 1.8.9 共用同一套 MCP 名字，产物在 1.8.0–1.8.9 上都能加载；1.8 的玩家装的是
# 11.14.x，接口面完全一致。
minecraft_version=1.8.9
# 兼容区间下界：只用于 mcmod.info 的 mcversion 展示串（"[1.8,1.8.9]"），不参与编译
minecraft_version_min=1.8
# ForgeGradle 2.x 要 "<mc>-<forge>" 完整串：前面的 1.8.9 是 Minecraft，后面的才是 Forge。
# maven 上那个目录叫 11.15.1.2318-1.8.9，构建脚本会自己剥掉前缀。
forge_version=1.8.9-11.15.1.2318-1.8.9
# 1.8.9 的最后一个 stable 映射（mcp_stable:20-1.8.9）；不钉住就会跟着 snapshot 漂。
mappings_version=stable_20

# --- 模组 ------------------------------------------------------------------
mod_version=1.0.2
maven_group=org.yinyun
archives_base_name=smtcraft
